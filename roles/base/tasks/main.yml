- name: Adding ssh for simone
  tags: always
  authorized_key:
    user: simone
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHC+IdhbpFaW19OyTHxyqLHPcIln1KhUd4bmwHoulqaD ansible"

- name: Generate sshd_config file from template
  tags: ssh
  template: 
    src: "{{ ssh_template_file }}"
    dest: /etc/ssh/sshd_config
    owner: root
    group: root 
    mode: 0644
  notify: restart_sshd
