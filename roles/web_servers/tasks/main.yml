  - name: installation of apache2 and php packages on Ubuntu
    tags: apache2,ubuntu,php
    package: 
      name:
        - "{{ apache_package_name }}"
        - "{{ php_package_name }}"   
      state: latest

  - name: started httpd (Centos)
    tags: apache2,centos,php
    service: 
      name: "{{ apache_service }}"
      state: started
      enabled: yes

  - name: change email address for admin
    tags: apache2,centos,php
    lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin khan@testing.com
    when: ansible_distribution == "Amazon"
    register: httpd

  - name: Restart httpd (Centos)
    tags: apache2,centos,php
    service:
      name: httpd
      state: restarted
    when: httpd.changed

  - name: Copying of default.html to web server
    tags: html,copy
    copy:
      src: default-site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

