---
  - hosts: all
    become: true
    pre_tasks:
    - name: update the packages on Ubuntu
      tags: always
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
    - name: update the packages on Centos
      tags: always
      dnf:
        update_only: yes
        update_cache: yes
      when: ansible_distribution == "Amazon"

  - hosts: all
    become: true
    roles:
      - base

  - hosts: web
    become: true
    roles:
      - web_servers
      
  - hosts: databases
    become: true
    roles:
      - db_servers

  - hosts: file
    become: true
    roles:
      - file_servers
        
  - hosts: workstation
    become: true
    roles:
      - workstations 

